{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Akila Portfolio{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'portfolio_app/images/profile.png' %}" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <!-- <link rel="stylesheet" href="{% static 'portfolio_app/css/style1.css' %}"> -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm fixed-top" style="background-color:#080808;">
    <div class="container">
        <a class="navbar-brand animate__animated animate__fadeInDown" href="{% url 'portfolio_app:index' %}" style="font-size: x-large;">
            <span style="color: #ff004f;">A</span>kila
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto animate__animated animate__fadeIn">
                <li class="nav-item" style="font-size: x-large;"><a class="nav-link" href="{% url 'portfolio_app:index' %}">Home</a></li>
                <li class="nav-item" style="font-size: x-large;"><a class="nav-link" href="#about">About</a></li>
                <li class="nav-item" style="font-size: x-large;"><a class="nav-link" href="#projects">Projects</a></li>
                <li class="nav-item" style="font-size: x-large;"><a class="nav-link" href="#contact">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main content -->
<main class="mt-5 pt-5">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center mt-5 py-3 bg-dark text-light">
    <p>&copy; 2025 Akila Portfolio. All rights reserved.</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


{% block extra_js %}{% endblock %}
</body>
</html>
